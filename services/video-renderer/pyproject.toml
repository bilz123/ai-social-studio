[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-renderer"
version = "0.1.0"
description = "Video Renderer service: FFmpeg compositing of clips, zoom, transitions, text, logo and music"
requires-python = ">=3.12"
dependencies = [
  "studio-common",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "pillow>=10.4",
  "numpy>=1.26",
]

[tool.setuptools.packages.find]
include = ["video_renderer*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "ASYNC", "RUF"]
ignore = ["ASYNC240", "ASYNC109"]

[tool.ruff.lint.isort]
known-first-party = ["video_renderer"]
known-third-party = ["studio_common"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["video_renderer", "tests"]
mypy_path = "../common"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*"]
ignore_missing_imports = true
