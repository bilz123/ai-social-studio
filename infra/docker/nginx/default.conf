# Public gateway (the only container with a published port).
#   /api/*       -> Laravel (php-fpm), same origin as the SPA, so no CORS is needed
#   /internal/*  -> never routed from outside (reserved for service-to-service webhooks, Phase 2)
#   everything else -> the React dev server (Vite), including its HMR websocket
# The Python AI service is deliberately not reachable through this gateway.

upstream laravel_fpm {
    server api:9000;
}

upstream vite_dev {
    server web:5173;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # API bodies are small JSON. File uploads go straight to object storage via presigned URLs.
    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /internal/ {
        return 404;
    }

    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass laravel_fpm;
        fastcgi_read_timeout 60s;
    }

    location / {
        proxy_pass http://vite_dev;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
