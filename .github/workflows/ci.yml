name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uci -pci-password --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, pdo_mysql, redis, intl, bcmath, zip, gd, exif, fileinfo
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      # Run tests even when style checks fail, so one push reports every problem.
      - run: php artisan test
        if: ${{ !cancelled() }}
      # The test suite runs on SQLite; this proves the migrations on the real engine (MySQL 8.4),
      # including foreign keys, CHECK constraints, rollback and re-migration, plus Redis health.
      - name: Migrate on MySQL (up, down, up) and check service health
        if: ${{ !cancelled() }}
        env:
          APP_ENV: ci
          APP_KEY: base64:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ci
          DB_USERNAME: ci
          DB_PASSWORD: ci-password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          HEALTH_CHECK_REDIS: "true"
          LOG_CHANNEL: stderr
        run: |
          php artisan migrate --force
          php artisan db:seed --force
          php artisan migrate:rollback --force --step=20
          php artisan migrate --force
          php artisan health:check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest
        env:
          REDIS_URL: redis://localhost:6379/2

  ai-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: common, package: studio_common }
          - { service: image-analyzer, package: image_analyzer }
          - { service: description-analyzer, package: description_analyzer }
          - { service: video-generator, package: video_generator }
          - { service: video-renderer, package: video_renderer }
          - { service: video-optimizer, package: video_optimizer }
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and a font (real-media tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - run: pip install -e ../common[dev]
      - run: pip install -e ".[dev]"
        if: matrix.service != 'common'
      - run: ruff check .
      - run: ruff format --check .
      - name: Type check
        run: mypy ${{ matrix.package }}
      - run: pytest

  ai-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./services/common ./services/image-analyzer ./services/description-analyzer ./services/video-generator ./services/video-renderer ./services/video-optimizer
      - name: OpenAPI contracts match the code
        run: python scripts/export-ai-openapi.py --check

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/init-env.sh
      - run: docker compose --env-file .env -f infra/compose/docker-compose.yml config --quiet
